name: Release on tag

# Pushing a v* tag builds the release APK and attaches it to a GitHub Release.
# Pushing to master alone does NOT produce a release — tag explicitly, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-on-tag
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # JDK 17, NOT 21: this project's Kotlin/kapt toolchain dies on 21 with
      # "IllegalAccessError ... com.sun.tools.javac".
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Built before the signing key is written into the tree. Afterwards the checkout is
      # dirty and the binary's own build info says vcs.modified=true, which reads as "built from
      # changed source" to anyone who inspects it -- true, but about a file that has
      # nothing to do with this program.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache: false

      - name: Build the bridge
        run: |
          ( cd bridge && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
              -o ../kotozute-bridge-linux-amd64 . )
          sha256sum kotozute-bridge-linux-amd64 > kotozute-bridge-linux-amd64.sha256
          ls -l kotozute-bridge-linux-amd64

      # There is no fallback key any more, so without these the build would produce an
      # unsigned APK and happily attach it to a release. Fail loudly instead.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - refusing to build an unsigned release."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing/signing.properties

      # The tag is the single source of truth for the version. versionCode is derived from
      # it rather than from the run number so it stays monotonic and reproducible: v1.2.3
      # becomes 10203. A workflow_dispatch run has a branch name here, not a version, so it
      # falls through to the defaults in presentation/build.gradle.
      - name: Build release APK
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version_name="${GITHUB_REF_NAME#v}"
            IFS=. read -r major minor patch <<< "$version_name"
            version_code=$(( major * 10000 + minor * 100 + patch ))
            echo "Building $version_name (versionCode $version_code)"
            ./gradlew :presentation:assembleRelease \
              -PappVersionName="$version_name" \
              -PappVersionCode="$version_code"
          else
            echo "Ref '$GITHUB_REF_NAME' is not a vX.Y.Z tag; using the versions in build.gradle"
            ./gradlew :presentation:assembleRelease
          fi

      # An app signed with the wrong key cannot be taken back once anyone has installed it,
      # so this asserts positively that the APK carries the one key this app has ever used,
      # rather than merely that it is not some particular wrong one. The repo used to hold a
      # throwaway keystore and check the APK was not signed with that; a check shaped like
      # that passes for every wrong key except the one it names.
      - name: Verify the signing certificate
        env:
          EXPECTED: f4adf9a4ba3644c7ee15e0fb3619bd9c6f25073acd36d69d3bad9cd7f1a2fbcf
        run: |
          apk=$(find presentation/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          digest=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          if [ -z "$digest" ]; then
            echo "::error::Could not read a signing certificate - refusing to release unchecked."
            exit 1
          fi
          if [ "$digest" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $digest, expected $EXPECTED."
            exit 1
          fi

      # Two copies of the same APK go up. The versioned name is what people end up with
      # in their downloads folder and what a checksum quoted anywhere refers to; the
      # unversioned one exists so that
      #   .../releases/latest/download/kotozute.apk
      # is a link that keeps working after the next release, which a versioned link does
      # not. Both are byte-identical - only the file name differs.
      - name: Rename APK and generate checksum
        run: |
          apk_name="kotozute-${GITHUB_REF_NAME}.apk"
          apk_path=$(find presentation/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          cp "$apk_path" "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          cp "$apk_path" kotozute.apk
          sha256sum kotozute.apk > kotozute.apk.sha256

      # The bridge, built here so nobody needs Go to install it. It was the one prerequisite
      # that bought nothing: signal-cli arrives as a tarball and Java is a package, but the
      # bridge could only be had by compiling it. Static, no cgo, so it runs on any x86-64
      # Linux whatever its libc.
      # The generated notes are a list of commits; they cannot say what someone has to do
      # before installing. This goes above them, and can be emptied once nobody is still
      # upgrading from a build signed with the checked-in key.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # kotozute-*.apk does not match kotozute.apk, so the fixed-name pair is listed.
          files: |
            kotozute-*.apk
            kotozute-*.apk.sha256
            kotozute.apk
            kotozute.apk.sha256
            kotozute-bridge-linux-amd64
            kotozute-bridge-linux-amd64.sha256
          # No body_path: the standing description of the app lives in the README,
          # and stamping it over every release body buried the news under it --
          # 13 of 32 published notes said nothing about what had changed. What CI
          # writes now is the changelog; the note itself is written by hand.
          generate_release_notes: true
