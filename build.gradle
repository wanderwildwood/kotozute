// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.androidx_appcompat_version = '1.6.1'
    ext.androidx_emoji2_version = '1.4.0'
    ext.androidx_constraintlayout_version = '1.1.3'
    ext.androidx_core_version = '1.1.0'
    ext.androidx_documentfile_version = '1.0.1'
    ext.androidx_exifinterface_version = '1.0.0'
    ext.androidx_testrunner_version = '1.1.0-alpha3'
    ext.androidx_viewpager_version = '1.0.0-beta05'
    ext.autodispose_version = '1.3.0'
    ext.billing_version = '5.1.0'
    ext.conductor_version = '2.1.5'
    ext.coroutines_version = '1.4.3'
    ext.dagger_version = "2.18"
    ext.espresso_version = '3.1.0-alpha3'
    ext.exoplayer_version = "r2.9.0"
    ext.glide_version = "4.16.0"
    ext.junit_version = '4.12'
    ext.kotlin_version = '2.2.20'
    // The self-built Signal service layer (signal-service/) -- see its build files. Both of
    // these are OURS, not the value Signal's libs.versions.toml carries, and deliberately:
    //   jackson    upstream pins 2.12.0; the app already resolves 2.22.1 through the old
    //              prebuilt fork, and jackson-databind is the deserialiser a Signal envelope
    //              goes through. Taking upstream's number here would be a downgrade.
    //   libsignal  upstream pins 0.102.1; this is the version of `libsignal-android` the app
    //              already declares, and the native library and the Java API ship together.
    //              Moving it is a separate change from moving the service source.
    ext.jackson_version = '2.22.1'
    ext.libsignal_version = '0.102.0'
    ext.lifecycle_version = '2.1.0'
    ext.material_version = '1.0.0'
    ext.mockito_version = '2.18.3'
    ext.moshi_version = '1.8.0'
    ext.okhttp3_version = '4.10.0'
    ext.realm_version = '10.15.0'
    ext.realm_adapters_version = '3.1.0'
    ext.rxandroid_version = '2.0.1'
    ext.rxdogtag_version = '0.2.0'
    ext.rxbinding_version = '2.0.0'
    ext.rxjava_version = '2.1.4'
    ext.rxkotlin_version = '2.1.0'
    ext.rx_preferences_version = '2.0.0-RC3'
    ext.timber_version = '5.0.1'
    ext.androidx_work_version = "2.8.0"

    ext.abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2]

    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven {
            name 'glide-snapshot'
            url 'https://oss.sonatype.org/content/repositories/snapshots'
        }
        // jitpack goes LAST, after everything else has been asked. It used to be first,
        // and when it went down on 2026-08-28 nothing could be built or released at all -
        // including the Realm plugin, which Maven Central serves perfectly well. Four
        // dependencies really do live here (ExoPlayer r2.9.0, realm-android-adapters, and
        // a 961-byte annotation shim), so it stays; it just no longer gets asked first.
        maven { url "https://jitpack.io" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.5.2'
        classpath 'com.google.gms:google-services:4.3.14'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "io.realm:realm-gradle-plugin:$realm_version"
        // For signal-service/. The excludes are upstream's, from Signal-Android
        // `build.gradle.kts:34-40` -- the generators for other languages and the gRPC
        // runtime, none of which anything here generates or calls.
        // For signal-service/lib-network and signal-service/serialization, which upstream
        // applies as `alias(libs.plugins.kotlinx.serialization)`.
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath('com.squareup.wire:wire-gradle-plugin:6.4.5') {
            exclude group: 'com.squareup.wire', module: 'wire-swift-generator'
            exclude group: 'com.squareup.wire', module: 'wire-grpc-client'
            exclude group: 'com.squareup.wire', module: 'wire-grpc-jvm'
            exclude group: 'com.squareup.wire', module: 'wire-grpc-server-generator'
        }
        // Signal's custom schema handler. Upstream puts its prebuilt jar on this classpath;
        // this is the same code, built from source by the included build in
        // signal-service/wire-handler and substituted in by settings.gradle.
        classpath 'org.signal:wire-handler:1.0.0'
    }
}

allprojects {
    repositories {
        // Order is deliberate: the repositories that hold almost everything come first.
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven {
            name 'glide-snapshot'
            url 'https://oss.sonatype.org/content/repositories/snapshots'
        }
        // jitpack goes LAST, after everything else has been asked. It used to be first,
        // and when it went down on 2026-08-28 nothing could be built or released at all -
        // including the Realm plugin, which Maven Central serves perfectly well. Four
        // dependencies really do live here (ExoPlayer r2.9.0, realm-android-adapters, and
        // a 961-byte annotation shim), so it stays; it just no longer gets asked first.
        // Signal's own artifact host, for libsignal. Maven Central carries this library but
        // stops at 0.76.1, years behind. Narrowed with content{} so it is only ever asked
        // about org.signal -- the jitpack outage on 2026-08-28 was the lesson that a
        // repository which answers everything becomes a single point of failure for
        // everything.
        maven {
            name 'signal'
            url 'https://build-artifacts.signal.org/libraries/maven'
            content { includeGroup 'org.signal' }
        }
        maven { url "https://jitpack.io" }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

subprojects {
    afterEvaluate {
        if (project.hasProperty('kapt')) {
            kapt {
                // we expect this closure to run over a org.jetbrains.kotlin.gradle.plugin.KaptExtension
                javacOptions {
                    option("-source", "8")
                    option("-target", "8")
                }
            }
        }
    }
}

// Kotlin 2.x stops defaulting its JVM target to the Java one, and the modules here never all
// said what they wanted -- two of the five said nothing at all. Rather than write the same
// pair into each build file, say it once. 1.8 because that is what this project has always
// compiled to and changing it is a separate decision from upgrading the compiler.
subprojects {
    plugins.withId('com.android.base') {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
        }
    }
}
