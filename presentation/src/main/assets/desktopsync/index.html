<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A minimum width, not device-width. This is a two-pane desktop layout with no
     responsive breakpoints, on purpose: the Kompakt has the native app and this is the
     window onto it from a computer. Told device-width, a phone renders that layout
     squeezed into 480px and the message pane comes out about 160px wide. Given a width
     instead, the same phone scales the whole thing down to fit -- small, but complete and
     correct, and it can be zoomed. A desktop is unaffected: the value is below any real
     desktop window, so nothing is scaled there. -->
<meta name="viewport" content="width=1024">
<title>Messaging — Desktop Sync</title>
<!-- Written by the phone with the token in start_url, so an installed window opens straight
     into the conversations instead of a refusal. app.js points this at the token it holds. -->
<link id="manifest" rel="manifest" href="/manifest.webmanifest">
<!-- Favicon mirrors the app's launcher icon (speech bubble + pencil). Inlined as a
     data URI so it needs no extra server route and no unauthenticated /favicon.ico. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='3' width='28' height='20' rx='5' fill='%23000'/><path d='M20 22h6l-5 7z' fill='%23000'/><path d='M20.5 7l3.5 3.5-9 9-4.6 1.1 1.1-4.6z' fill='%23fff'/></svg>">
<style>
  /* The phone is strictly black-on-white because e-ink can't do anything else, but this
     dashboard is viewed on a real display — so it gets a proper dark theme. Every colour
     goes through a variable; `data-theme` on <html> is always resolved to a concrete
     light/dark by app.js (an "auto" preference is resolved against prefers-color-scheme
     there rather than in a media query, so the explicit override can win cleanly). */
  :root, :root[data-theme="light"] {
    --ink: #000;
    --paper: #fff;
    --muted: #666;
    --line: #e5e5e5;
    --hover: #fafafa;
    --active: #f0f0f0;
    --shadow: rgba(0,0,0,0.28);
  }
  :root[data-theme="dark"] {
    --ink: #e6e6e6;
    --paper: #0d0d0d;
    --muted: #8c8c8c;
    --line: #2b2b2b;
    --hover: #171717;
    --active: #212121;
    --shadow: rgba(0,0,0,0.6);
  }
  /* Before app.js runs, follow the system so there's no light flash on a dark desktop. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --ink: #e6e6e6;
      --paper: #0d0d0d;
      --muted: #8c8c8c;
      --line: #2b2b2b;
      --hover: #171717;
      --active: #212121;
      --shadow: rgba(0,0,0,0.6);
    }
  }
  /* Scrollbars and native form controls follow the theme. `color-scheme` is what actually
     switches the browser's built-in widgets; the explicit rules below then style the
     scrollbar itself, since the default dark one is heavier than this design wants. */
  :root, :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { color-scheme: dark; }
  }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 6px;
    border: 3px solid var(--paper); background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    /* "Kompakt Emoji" leads, but its unicode-range confines it to emoji, so every letter and
       digit still comes from Lato. The effect is that emoji look here exactly as they look on
       the phone -- including in messages already received, not just in the picker. */
    font-family: "Kompakt Emoji", Lato, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--paper);
  }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    border-bottom: 3px solid var(--ink);
    flex: 0 0 auto;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  /* Floating compose button, bottom-left over the conversation list. Fixed rather
     than inside #threads so it stays put while the list scrolls. */
  #newBtn {
    position: fixed; left: 20px; bottom: 20px; z-index: 10;
    width: 44px; height: 44px; padding: 0;
    border: none; border-radius: 4px;
    background: var(--ink); color: var(--paper);
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px var(--shadow);
    cursor: pointer;
  }
  #newBtn:hover { opacity: 0.8; background: var(--ink); color: var(--paper); }
  #status { margin-left: auto; font-size: 13px; color: var(--muted); }
  #settingsBtn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0;
    /* --ink on --paper, like every other control in this header. It was the other way
       round, which made the cog the same colour as the background it sat on: invisible in
       both themes, an empty bordered square. Checking getBBox said the path was 19x19 and
       proved only that it existed -- geometry is not visibility. */
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 999px; cursor: pointer;
  }
  #settingsBtn:hover { background: var(--ink); color: var(--paper); }
  #settingsPanel {
    position: absolute; top: 46px; right: 12px; z-index: 40;
    width: 280px; max-height: 78vh; overflow-y: auto; padding: 6px 0;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); border-radius: 5px;
    box-shadow: 0 3px 12px rgba(0,0,0,.2);
  }
  #settingsPanel[hidden] { display: none; }
  #settingsPanel h3 {
    margin: 10px 14px 4px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  #settingsPanel .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; font-size: 13px; cursor: pointer;
  }
  #settingsPanel .row:hover { background: var(--line); }
  #settingsPanel .row input[type=checkbox] { margin: 0; flex: 0 0 auto; }
  #settingsPanel .row .label { flex: 1 1 auto; }
  #settingsPanel .row .note { display: block; font-size: 11px; color: var(--muted); }
  #settingsPanel .row.act { color: var(--ink); }
  #settingsPanel .row.act.danger { color: #a00; }
  #settingsPanel hr { margin: 6px 0; border: 0; border-top: 1px solid var(--line); }
  #themeBtn {
    padding: 5px 12px; font: inherit; font-size: 12px; font-weight: 700;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--paper); color: var(--muted); cursor: pointer;
  }
  #themeBtn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  #launcherPanel {
    position: absolute; right: 12px; top: 52px; z-index: 40; max-width: 420px;
    background: var(--paper); color: var(--ink); border: 2px solid var(--ink);
    border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.5;
  }
  #launcherPanel h2 { font-size: 14px; margin: 0 0 6px; }
  #launcherPanel p { margin: 0 0 10px; }
  #launcherPanel a.dl {
    display: inline-block; padding: 5px 12px; border: 2px solid var(--ink);
    border-radius: 999px; text-decoration: none; color: var(--ink);
  }
  #launcherPanel a.dl:hover { background: var(--ink); color: var(--paper); }
  #launcherPanel button.close {
    font: inherit; background: none; border: 0; color: var(--muted);
    cursor: pointer; padding: 0; text-decoration: underline;
  }
  #installBtn, #launcherBtn {
    font: inherit; font-size: 13px; padding: 4px 10px; margin-left: 8px;
    border: 2px solid var(--ink); border-radius: 999px; background: var(--paper);
    color: var(--ink); cursor: pointer; text-decoration: none; line-height: 1.4;
  }
  #installBtn:hover, #launcherBtn:hover { background: var(--ink); color: var(--paper); }
  #status.live::before {
    content: ""; display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink); margin-right: 6px; vertical-align: middle;
  }

  main { display: flex; flex: 1 1 auto; min-height: 0; }

  /* Left column = fixed-height search box above a scrolling list */
  #leftPane {
    width: 320px; flex: 0 0 320px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  #searchWrap { flex: 0 0 auto; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #markAllBtn {
    margin-top: 8px; width: 100%; padding: 6px 8px; font-size: 13px;
    background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
    cursor: pointer;
  }
  #markAllBtn:hover { color: var(--ink); border-color: var(--ink); }
  #archiveBtn {
    margin-top: 8px; width: 100%; padding: 6px 8px; font-size: 13px;
    background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
    cursor: pointer;
  }
  #archiveBtn:hover { color: var(--ink); border-color: var(--ink); }
  #threadMenu {
    position: fixed; z-index: 50; min-width: 160px; padding: 4px 0;
    background: var(--paper); border: 1px solid var(--ink); border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  #threadMenu button {
    display: block; width: 100%; padding: 7px 14px; border: 0; background: none;
    font: inherit; font-size: 13px; color: var(--ink); text-align: left; cursor: pointer;
  }
  #threadMenu button:hover { background: var(--line); }
  #threadMenu button.danger { color: #a00; }
  #threadMenu hr { margin: 4px 0; border: 0; border-top: 1px solid var(--line); }
  #infoPanel {
    position: fixed; inset: 0; z-index: 60; display: flex;
    align-items: center; justify-content: center; background: rgba(0,0,0,.4);
  }
  /* An explicit display beats the browser's [hidden] rule, so without this the panel is
     on screen from page load with nothing in it, over the whole app, and the Close button
     cannot dismiss it because setting .hidden changes nothing. Any element given a display
     here needs its own hidden rule. */
  #infoPanel[hidden] { display: none; }
  #infoCard {
    max-width: 420px; margin: 20px; padding: 20px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); border-radius: 6px;
  }
  #infoCard h2 { margin: 0 0 12px; font-size: 16px; }
  #infoCard p { margin: 12px 0 0; font-size: 13px; line-height: 1.5; }
  #infoCard p.changed { font-weight: 700; }
  .safetyNumber {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px;
    line-height: 1.7; letter-spacing: .5px; word-spacing: 6px;
  }
  #linkFilter {
    width: 100%; margin-top: 12px; padding: 7px 10px; font: inherit; font-size: 14px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
  }
  #linkList { max-height: 300px; margin-top: 8px; overflow-y: auto; }
  #linkList button {
    display: block; width: 100%; padding: 8px 10px; font: inherit; font-size: 13px;
    text-align: left; background: none; color: var(--ink);
    border: 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  #linkList button:hover { background: var(--line); }
  #schedList { max-height: 320px; margin-top: 12px; overflow-y: auto; }
  .schedRow { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .schedMeta { font-size: 11px; color: var(--muted); }
  .schedBody { margin: 3px 0 6px; font-size: 13px; word-break: break-word; }
  .schedRow button {
    padding: 3px 10px; font: inherit; font-size: 12px;
    background: none; color: #a00;
    border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
  }
  .schedRow button:hover { border-color: #a00; }
  .schedRow button:disabled { opacity: .5; cursor: default; }
  .acctNumber {
    margin-top: 10px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 16px; letter-spacing: .5px;
  }
  #devList { margin-top: 10px; }
  .devRow { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .devName { font-size: 13px; }
  .devMeta { font-size: 11px; color: var(--muted); }
  #infoClose {
    margin-top: 16px; padding: 6px 14px; font: inherit; font-size: 13px;
    background: var(--ink); color: var(--paper); border: 0; border-radius: 4px; cursor: pointer;
  }
  #pairGate { max-width: 340px; margin: 18vh auto; padding: 0 20px; text-align: center; }
  #pairGate h1 { font-size: 20px; margin: 0 0 12px; }
  #pairGate p { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
  #pairCode { width: 100%; box-sizing: border-box; padding: 10px; font-size: 22px;
    letter-spacing: 4px; text-align: center; border: 1px solid var(--line);
    border-radius: 6px; background: var(--paper); color: var(--ink); }
  #pairGo { margin-top: 12px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
  #pairErr { color: #b00020; margin-top: 12px; }
  #signalSetup { flex: 0 0 auto; padding: 10px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel, transparent); }
  #signalSetup p { margin: 0 0 8px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  #signalSetup code { font-size: 11px; }
  #signalSetupRow { display: flex; gap: 6px; }
  #signalPayload { flex: 1 1 auto; min-width: 0; padding: 6px 8px; font-size: 12px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--paper, #fff);
    color: var(--ink, #000); }
  #signalPairBtn { flex: 0 0 auto; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #signalSetupError { color: #b00020; margin-top: 6px; }
  #searchBox { position: relative; }
  #searchField {
    width: 100%; padding: 8px 12px; font: inherit; font-size: 14px;
    border: 1px solid var(--ink); border-radius: 18px;
    outline: none; background: var(--paper); color: var(--ink);
  }
  /* Room for the clear button, so a long query does not run underneath it. */
  #searchField.has-query { padding-right: 34px; }
  #searchClear {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    width: 24px; height: 24px; padding: 0; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    font: inherit; font-size: 18px;
    border: 0; border-radius: 50%; cursor: pointer;
    background: transparent; color: var(--muted);
  }
  #searchClear:hover { color: var(--ink); }
  #searchClear[hidden] { display: none; }
  #threads {
    flex: 1 1 auto;
    overflow-y: auto;
  }
  #noMatches { padding: 16px; font-size: 13px; color: var(--muted); }
  #loadMore {
    display: block; margin: 0 auto 18px; padding: 8px 18px;
    font: inherit; font-size: 13px; font-weight: 700;
    border: 2px solid var(--ink); border-radius: 8px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  #loadMore:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  #loadMore:disabled { opacity: 0.5; cursor: default; }
  .thread {
    padding: 12px 16px; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .thread:hover { background: var(--hover); }
  .thread.active { background: var(--active); }
  .thread .row { display: flex; align-items: baseline; gap: 8px; }
  .thread .name { font-weight: 700; font-size: 15px; }
  /* Mirrors the phone's rail chip: filled, not outlined, so it reads at a glance. */
  #crossBtn {
    /* auto, not a fixed gap: it takes the slack in the row and ends up hard right,
       whatever else is or is not showing beside the title. */
    margin-left: auto; padding: 3px 9px; font-size: 11px; font-weight: 700;
    background: var(--ink); color: var(--paper);
    border: 0; border-radius: 3px; cursor: pointer; white-space: nowrap;
  }
  #crossBtn:hover { opacity: .8; }
  .thread .rail { background: var(--ink); color: var(--paper); font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
  .thread .when { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .thread .snippet {
    font-size: 13px; color: var(--muted); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .thread.unread .name, .thread.unread .snippet { font-weight: 700; color: var(--ink); }
  /* A conversation holding unsent text shows that text instead of the last message,
     italicised so it's obviously yours-and-unsent rather than something that arrived. */
  .thread .snippet.draft { font-style: italic; }

  #pane { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #paneHeader {
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    font-weight: 700; flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
  }
  #toWrap { position: relative; flex: 1 1 auto; max-width: 340px; }
  #toField {
    width: 100%;
    padding: 7px 12px; font: inherit; font-size: 15px; font-weight: 400;
    border: 1px solid var(--ink); border-radius: 18px;
    outline: none; background: var(--paper); color: var(--ink);
  }
  #suggestions {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    max-height: 240px; overflow-y: auto;
  }
  #suggestions:empty { display: none; }
  /* Matches #toField, minus the flex growth: it sits beside the recipient box and should
     be no wider than the carrier name it holds. */
  #simField {
    flex: 0 0 auto;
    padding: 7px 12px; font: inherit; font-size: 15px; font-weight: 400;
    border: 1px solid var(--ink); border-radius: 18px;
    outline: none; background: var(--paper); color: var(--ink);
  }
  .suggestion { padding: 9px 12px; cursor: pointer; font-weight: 400; }
  .suggestion + .suggestion { border-top: 1px solid var(--line); }
  .suggestion:hover, .suggestion.sel { background: var(--active); }
  .suggestion .sName { font-weight: 700; font-size: 14px; }
  .suggestion .sNum { font-size: 13px; color: var(--muted); }
  #messages { flex: 1 1 auto; overflow-y: auto; padding: 20px; }
  #empty {
    margin: auto; color: var(--muted); font-size: 14px;
    display: flex; height: 100%; align-items: center; justify-content: center;
  }

  .msg { display: flex; margin-bottom: 14px; }
  /* The width cap lives on the flex item, NOT the bubble: a percentage width on
     the bubble would resolve against its own shrink-to-fit parent, which collapses
     the bubble to one word per line. */
  .msg .stack { max-width: 68%; min-width: 0; }
  .msg .bubble {
    padding: 9px 13px;
    border: 1px solid var(--ink); border-radius: 18px;
    background: var(--paper);
    white-space: pre-wrap; overflow-wrap: break-word;
    font-size: 15px; line-height: 1.4;
  }
  .msg .bubble img.attach {
    display: block; max-width: 100%; max-height: 340px;
    width: auto; height: auto; border-radius: 10px;
    cursor: zoom-in;
  }
  /* Space the image away from any text in the same bubble */
  .msg .bubble img.attach:not(:first-child),
  .msg .bubble .attachLink:not(:first-child) { margin-top: 8px; }
  .msg .bubble .attachLink { display: inline-block; color: var(--ink); }
  .msg.me { justify-content: flex-end; }
  .msg.me .bubble { border-width: 3px; }
  /* Said in the reader's own voice rather than the sender's: this is the app explaining
     an absence, not something anyone typed. */
  .viewOnce { font-style: italic; color: var(--muted); }
  .reactions {
    margin-top: 4px; font-size: 13px; line-height: 1;
    /* Its own line under the text, not hung off the bubble's corner: the browser bubble is
       a plain flow box and a faked overlap would need absolute positioning to gain nothing. */
  }
  .expiry { margin-top: 4px; font-size: 11px; color: var(--muted); }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg .stamp { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .msg .bubble video.attach { display: block; max-width: 100%; height: auto; }
  .msg .bubble video.attach:not(:first-child) { margin-top: 8px; }
  .msg.me .stamp { text-align: right; }
  /* A message the phone would not send. Dashed rather than coloured: the rest of this
     page is ink on paper, and an e-ink screen has nothing to render a red with. */
  .msg .bubble.failed { border-style: dashed; }

  form {
    display: flex; gap: 10px; padding: 14px 20px;
    border-top: 3px solid var(--ink); flex: 0 0 auto;
    /* Bottom-align so the Send button stays level with the last line as the
       composer grows for a multi-line message. */
    align-items: flex-end;
  }
  input[type=text], #body {
    flex: 1 1 auto; padding: 11px 14px; font: inherit; font-size: 15px;
    border: 1px solid var(--ink); border-radius: 22px; outline: none;
    background: var(--paper); color: var(--ink);
  }
  /* Shift+Enter inserts a newline, so the composer is a textarea. It's sized by JS
     to fit its content (see autoGrow in app.js) and capped here — past that it
     scrolls rather than swallowing the conversation. */
  #body {
    resize: none; overflow-y: auto;
    line-height: 1.4; max-height: 8.4em; /* ~6 lines */
  }
  /* The phone's own emoji font, served by the relay off the Kompakt's system partition.
     unicode-range is what makes it safe to list first: the font also covers 0-9, # and *
     (they are the bases of the keycap emoji), and without the range every timestamp and
     phone number in the app would be drawn in it. Any emoji the font lacks -- the
     regional-indicator flags, mainly -- simply falls through to the browser's own set. */
  @font-face {
    font-family: "Kompakt Emoji";
    src: url("/emoji-font") format("truetype");
    font-display: swap;
    unicode-range: U+203C-203E, U+2049, U+20E3, U+2122, U+2139, U+2194-21AA,
      U+231A-231B, U+2328, U+23CF-23FA, U+24C2, U+25AA-25FE, U+2600-27EF,
      U+2934-2935, U+2B00-2BFF, U+3030, U+303D, U+3297, U+3299, U+1F000-1FAFF;
  }

  #emojiPanel {
    display: none; flex-direction: column; gap: 8px;
    border: 2px solid var(--ink); border-radius: 10px;
    padding: 10px; max-height: 260px; background: var(--paper);
  }
  #emojiPanel.open { display: flex; }
  #emojiTabs { display: flex; flex-wrap: wrap; gap: 6px; }
  #emojiTabs button {
    padding: 4px 10px; font-size: 12px; font-weight: 700;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--paper); color: var(--muted);
  }
  #emojiTabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #emojiGrid {
    overflow-y: auto; display: grid; gap: 2px;
    grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
  }
  #emojiGrid button {
    padding: 0; height: 34px; border: none; background: none;
    font-size: 21px; line-height: 1; border-radius: 6px;
  }
  #emojiGrid button:hover { background: var(--line); color: inherit; }
  /* Square like the attach button, so the two read as a pair. */
  #emojiBtn { flex: 0 0 auto; padding: 11px 0; width: 44px; font-size: 18px; line-height: 1; }

  /* The composer is a column now: the attachment strip sits above the row that
     holds the box and the buttons, so a queued picture pushes the text up rather
     than squeezing it sideways. */
  form { flex-direction: column; align-items: stretch; gap: 10px; }
  #composerRow { display: flex; gap: 10px; align-items: flex-end; }

  #attachments {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  /* Same trap as #infoPanel: the display above beats [hidden], so the tray kept its gap
     and padding in the composer with nothing staged in it. */
  #attachments[hidden] { display: none; }
  .thumb {
    position: relative; width: 64px; height: 64px;
    border: 2px solid var(--ink); border-radius: 8px; overflow: hidden;
    background: var(--paper);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* A file with no preview of its own still needs to show that it is queued. */
  .thumb .name {
    display: flex; align-items: center; justify-content: center; height: 100%;
    font-size: 10px; text-align: center; padding: 4px; word-break: break-all;
  }
  .thumb button {
    position: absolute; top: 0; right: 0; width: 20px; height: 20px; padding: 0;
    font-size: 14px; line-height: 1; border: 0; border-bottom-left-radius: 8px;
    background: var(--ink); color: var(--paper); cursor: pointer;
  }
  /* Square, so it reads as an icon button beside the round composer, and sized to
     match the Send button's height rather than the text box's. */
  #attach {
    flex: 0 0 auto; padding: 11px 0; width: 44px; font-size: 20px; line-height: 1;
  }
  /* Dropping a file anywhere over the conversation counts, so the target is the
     whole pane and not a small strip nobody would aim for. */
  #messages.dropping { outline: 3px dashed var(--ink); outline-offset: -6px; }

  button {
    padding: 11px 22px; font: inherit; font-weight: 700; font-size: 15px;
    border: 2px solid var(--ink); border-radius: 10px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: 0.4; cursor: default; }

  /* Full-size viewer for picture messages. This browser is the only place these
     render in colour — the Kompakt's e-ink screen dithers them to grey — so the
     340px bubble cap shouldn't be the largest anyone ever sees them. Lives outside
     #messages so the poll's DOM rebuild can't tear it down while it's open. */
  #lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
    cursor: zoom-out;
  }
  /* `hidden` alone loses to the display:flex above — it needs restating. */
  #lightbox[hidden] { display: none; }
  #lightbox img {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    border-radius: 4px;
    background: var(--paper);
  }
  #lbClose {
    position: absolute; top: 16px; right: 20px;
    width: 40px; height: 40px; padding: 0;
    font-size: 26px; line-height: 1; font-weight: 400;
    border: 2px solid var(--paper); border-radius: 8px;
    background: transparent; color: var(--paper);
  }
  #lbClose:hover { background: var(--paper); color: var(--ink); }
  #lbOpen {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: var(--paper); cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <h1>Messaging</h1>
    <span id="status">connecting…</span>
    <button type="button" id="installBtn" title="Install this as an app on this computer" hidden>Install</button>
    <!-- A cog, not a hamburger: a hamburger promises a menu of places and there is one
         place behind this. The same reasoning, and the same glyph, as the phone's. -->
    <button type="button" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M19.14,12.94c0.04,-0.31 0.06,-0.63 0.06,-0.94c0,-0.31 -0.02,-0.63 -0.06,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.37 4.8,11.69 4.8,12s0.02,0.63 0.06,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/>
      </svg>
    </button>
  </header>
  <div id="settingsPanel" hidden></div>
  <div id="launcherPanel" hidden></div>
  <main>
    <aside id="leftPane">
      <!-- Only while Signal is unpaired. Pairing means a ~140-character link, two thirds of
           it a hex fingerprint, and typing that on an e-ink phone is the worst thing this
           app asks of anyone. Here it is a paste. -->
      <div id="signalSetup" hidden>
        <p id="signalSetupText">Signal isn't set up on this phone. Run
          <code>kotozute-bridge --pairing</code> on the machine running the bridge and paste
          the line it prints:</p>
        <div id="signalSetupRow">
          <input type="text" id="signalPayload" placeholder="kotozute-bridge://…" autocomplete="off" spellcheck="false">
          <button type="button" id="signalPairBtn">Pair</button>
        </div>
        <p id="signalSetupError" hidden></p>
      </div>

      <div id="searchWrap">
        <div id="searchBox">
          <input type="text" id="searchField" placeholder="Search conversations" autocomplete="off">
          <button type="button" id="searchClear" aria-label="Clear search" hidden>&times;</button>
        </div>
        <!-- Only when there is something unread, the same rule the phone uses: on a narrow
             pane a control that never has anything to do is just width spent. -->
        <button type="button" id="markAllBtn" hidden>Mark all read</button>
        <button type="button" id="archiveBtn">Archived</button>
      </div>
      <div id="threads"></div>
    </aside>

    <!-- One menu, moved and refilled per conversation, rather than one built into every
         row: the list is re-rendered on every poll and 300 hidden menus would be rebuilt
         with it. Right-click here is the phone's long-press. -->
    <div id="threadMenu" hidden role="menu"></div>

    <!-- Safety numbers, and anything else about a thread worth a panel rather than a row. -->
    <div id="infoPanel" hidden>
      <div id="infoCard">
        <div id="infoBody"></div>
        <button type="button" id="infoClose">Close</button>
      </div>
    </div>
    <button type="button" id="newBtn" title="New conversation" aria-label="New conversation">
      <!-- The same pencil the phone's compose button uses, path and all, so "new message" reads
           as one thing on both. The only + left in this corner is the one that attaches. -->
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M3,17.25V21h3.75L17.81,9.94l-3.75,-3.75L3,17.25zM20.71,7.04c0.39,-0.39 0.39,-1.02 0,-1.41l-2.34,-2.34c-0.39,-0.39 -1.02,-0.39 -1.41,0l-1.83,1.83 3.75,3.75 1.83,-1.83z"/>
      </svg>
    </button>
    <section id="pane">
      <div id="paneHeader">
        <span id="paneTitle">Select a conversation</span>
        <span id="toWrap" hidden>
          <input type="text" id="toField" placeholder="Name or number" autocomplete="off">
          <div id="suggestions"></div>
        </span>
        <!-- Which SIM a new conversation goes out on. Stays hidden unless the phone reports
             two of them, so a one-SIM phone never sees a choice it does not have. A reply
             needs no control: it goes out on the SIM the conversation is already on. -->
        <select id="simField" title="Send from" aria-label="Send from" hidden></select>
        <!-- The phone's rail badge: one person, two conversations, a way across. Last in
             the row and pushed right, so it sits in line with the contact name at the far
             end rather than crowding it. Only for a one-to-one thread, because a Signal
             group and an MMS group are different groups rather than two views of one. -->
        <button type="button" id="crossBtn" hidden></button>
      </div>
      <div id="messages"><div id="empty">Nothing selected</div></div>
      <form id="composer">
        <div id="attachments" hidden></div>
        <div id="emojiPanel">
          <div id="emojiTabs"></div>
          <div id="emojiGrid"></div>
        </div>
        <div id="composerRow">
          <!-- Pictures, video and contact cards: the three kinds of attachment carriers
               actually carry. MMS can hold arbitrary parts in principle, but anything else
               tends to be stripped in transit or arrive as nothing the far phone can open. -->
          <input type="file" id="fileField" multiple
                 accept="image/*,video/*,text/vcard,text/x-vcard,.vcf" hidden>
          <button type="button" id="attach" title="Attach a picture, video or contact"
                  aria-label="Attach a picture, video or contact" disabled>+</button>
          <button type="button" id="emojiBtn" title="Emoji" aria-label="Emoji" disabled>&#x1F642;</button>
          <textarea id="body" rows="1" placeholder="Write a message…" autocomplete="off" disabled></textarea>
          <button type="submit" id="send" disabled>Send</button>
        </div>
      </form>
    </section>
  </main>
  <div id="lightbox" hidden>
    <button type="button" id="lbClose" title="Close (Esc)" aria-label="Close">&times;</button>
    <img id="lbImg" alt="">
    <a id="lbOpen" target="_blank" rel="noopener">Open full size in a new tab &#8599;</a>
  </div>
  <script src="app.js"></script>
</body>
</html>
