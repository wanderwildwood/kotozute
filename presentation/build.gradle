apply plugin: 'com.android.application'
apply plugin: 'realm-android' // Realm needs to be before Kotlin or the build will fail
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

// Signing comes from a real keystore in signing/, which is gitignored and written by the
// release workflow from repository secrets. There is no fallback: a clone without it builds
// an unsigned release APK, which will not install anywhere, rather than a signed-looking one.
//
// This repo used to carry a throwaway keystore with password 'android' and fall back to it.
// A key in a public repo has no private half worth the name, and the fallback was silent -
// the build succeeded and produced something installable, which is the wrong way for a
// missing signing key to fail.
def realSigningProps = null
def realSigningPropsFile = rootProject.file('signing/signing.properties')
if (realSigningPropsFile.isFile()) {
    realSigningProps = new Properties()
    realSigningPropsFile.withInputStream { realSigningProps.load(it) }
}

android {
    compileSdk 34

    defaultConfig {
        applicationId 'com.wanderwildwood.kotozute'
        minSdkVersion 23
        targetSdkVersion 33
        // Released builds take their version from the git tag: the release workflow derives
        // both values from it and passes them in. Hand-editing this file was a release step
        // that got skipped once, shipping tag v1.0.2 as an APK still labelled 1.0.1.
        // The literals are the local-build fallback only, and never ship.
        // (Reset to 1.0.0 for this fork's first release; upstream InkMessage was at 0.0.4.)
        versionCode project.findProperty('appVersionCode')?.toInteger() ?: 2
        versionName project.findProperty('appVersionName') ?: '1.0.1'
        setProperty("archivesBaseName", "kotozute-v${versionName}")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (realSigningProps != null) {
            release {
                storeFile rootProject.file('signing/signing.keystore')
                storePassword realSigningProps['STORE_PASSWORD']
                keyAlias realSigningProps['KEY_ALIAS']
                keyPassword realSigningProps['KEY_PASSWORD']
            }
        }
//        release {
//            def keystoreProps = new Properties()
//            def keystorePropsFile = rootProject.file('./.gradle/.gradlerc')
//            storeFile file('./my-release-key.keystore')
//            keyAlias 'quik_release'
//            if (keystorePropsFile.exists()) {
//                keystoreProps.load(new FileInputStream(keystorePropsFile))
//            } else {
//                // do nothing
//            }
//            storePassword keystoreProps['storePassword']
//            keyPassword keystoreProps['keyPassword']
//        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (realSigningProps != null) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue("string", "app_name", "Messaging Debug")
            resValue("string", "application_id", defaultConfig.applicationId)
            if (realSigningProps != null) signingConfig signingConfigs.release
        }
        fdroid {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (realSigningProps != null) signingConfig signingConfigs.release
            matchingFallbacks = ['release']
            applicationIdSuffix ".fdroid"
        }
    }

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace 'com.wanderwildwood.kotozute'
    buildFeatures {
        buildConfig true
        viewBinding true
    }
//    if (System.getenv("CI") == "true") {
//        signingConfigs.release.storePassword = System.getenv("keystore_password")
//        signingConfigs.release.keyAlias = System.getenv("key_alias")
//        signingConfigs.release.keyPassword = System.getenv("key_password")
//    }
}

configurations {
    debug
    release
    fdroid
}

dependencies {
    // Scanning the bridge's pairing QR. Pure Java, no Play Services, no Kotlin metadata to
    // trip over -- 148 KB of scanner and the ZXing decoder behind it. The alternative was
    // reading a 140-character link off a terminal and getting it onto the phone somehow.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'

    // lifecycle
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // androidx
    implementation "androidx.appcompat:appcompat:$androidx_appcompat_version"
    implementation "androidx.emoji2:emoji2-bundled:$androidx_emoji2_version"
    implementation "androidx.constraintlayout:constraintlayout:$androidx_constraintlayout_version"
    implementation "androidx.core:core-ktx:$androidx_core_version"
    implementation "androidx.viewpager2:viewpager2:$androidx_viewpager_version"
    implementation "com.google.android.material:material:$material_version"
    implementation("androidx.work:work-runtime-ktx:$androidx_work_version")

    // conductor
    implementation "com.bluelinelabs:conductor:$conductor_version"
    implementation "com.bluelinelabs:conductor-archlifecycle:$conductor_version"

    // embedded server for the Desktop Sync relay
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    implementation "org.nanohttpd:nanohttpd-websocket:2.3.1"

    // glide
    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"

    // exoplayer
    implementation "com.github.google.ExoPlayer:exoplayer-core:$exoplayer_version"
    implementation("com.github.google.ExoPlayer:exoplayer-ui:$exoplayer_version", {
        exclude group: "com.android.support", module: "support-media-compat"
    })

    // rxbinding
    implementation "com.jakewharton.rxbinding2:rxbinding-kotlin:$rxbinding_version"
    implementation "com.jakewharton.rxbinding2:rxbinding-support-v4-kotlin:$rxbinding_version"

    // autodispose
    implementation "com.uber.autodispose:autodispose-android-archcomponents:$autodispose_version"
    implementation "com.uber.autodispose:autodispose-android-archcomponents-test:$autodispose_version"
    implementation "com.uber.autodispose:autodispose-android:$autodispose_version"
    implementation "com.uber.autodispose:autodispose:$autodispose_version"
    implementation "com.uber.autodispose:autodispose-lifecycle:$autodispose_version"

    // dagger
    implementation "com.google.dagger:dagger:$dagger_version"
    implementation "com.google.dagger:dagger-android-support:$dagger_version"
    kapt "com.google.dagger:dagger-compiler:$dagger_version"
    kapt "com.google.dagger:dagger-android-processor:$dagger_version"
    //Resolve jdk8+ Generation Annotations - javax annotation does not exist
    implementation 'com.github.pengrad:jdk9-deps:1ffe84c468'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // ezvcard
    implementation('com.googlecode.ez-vcard:ez-vcard:0.10.4', {
        exclude group: "org.jsoup", module: "jsoup"
        exclude group: "org.freemarker", module: "freemarker"
        exclude group: "com.fasterxml.jackson.core", module: "jackson-core"
    })

    // realm
    implementation "com.github.realm:realm-android-adapters:$realm_adapters_version"
    kapt "io.realm:realm-annotations:$realm_version"
    kapt "io.realm:realm-annotations-processor:$realm_version"

    // rxjava
    implementation "io.reactivex.rxjava2:rxandroid:$rxandroid_version"
    implementation "io.reactivex.rxjava2:rxjava:$rxjava_version"
    implementation "io.reactivex.rxjava2:rxkotlin:$rxkotlin_version"
    implementation "com.uber.rxdogtag:rxdogtag:$rxdogtag_version"
    implementation "com.uber.rxdogtag:rxdogtag-autodispose:$rxdogtag_version"


    // testing
    androidTestImplementation("androidx.test.espresso:espresso-core:$espresso_version", {
        exclude group: "com.android.support", module: "support-annotations"
    })
    androidTestImplementation "org.mockito:mockito-android:$mockito_version"
    testImplementation "androidx.test:runner:$androidx_testrunner_version"
    testImplementation "junit:junit:$junit_version"
    testImplementation "org.mockito:mockito-core:$mockito_version"

    // moshi
    implementation "com.squareup.moshi:moshi:$moshi_version"
    debugImplementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    kapt "com.squareup.moshi:moshi-kotlin-codegen:$moshi_version"

    // coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-rx2:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactive:$coroutines_version"

    implementation "com.github.chrisbanes:photoview:2.1.4"
    implementation "com.f2prateek.rx.preferences2:rx-preferences:$rx_preferences_version"
    implementation "com.github.google:flexbox-layout:0.3.1"
    implementation "com.jakewharton.timber:timber:$timber_version"
    implementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    implementation "me.leolin:ShortcutBadger:1.1.22"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation project(":android-smsmms")
    implementation project(":common")
    implementation project(':data')
    implementation project(':domain')

}
