// Signal-Android `core/network`, built from source.
// From `core/network/build.gradle.kts` at b92917acdb (2026-09-10).
plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    // Added upstream since b92917acdb: NetworkResult now deserialises with kotlinx.serialization
    // rather than only jackson.
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.squareup.wire'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain(21)
}

wire {
    kotlin {
        javaInterop = true
    }

    sourcePath {
        srcDir('src/main/protowire')
    }
}

dependencies {
    api "com.fasterxml.jackson.core:jackson-databind:$jackson_version"
    api "com.fasterxml.jackson.module:jackson-module-kotlin:$jackson_version"
    api 'io.reactivex.rxjava3:rxjava:3.1.12'
    api 'com.squareup.okio:okio:3.17.0'
    api 'com.squareup.okhttp3:okhttp:5.3.2'

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2'
    implementation "org.signal:libsignal-client:$libsignal_version"

    // Upstream added these two since b92917acdb: `NetworkResult` deserialises through
    // `SignalJson`, which lives in core/serialization.
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'

    implementation project(':signal-service:util-jvm')
    implementation project(':signal-service:models-jvm')
    implementation project(':signal-service:serialization')

    // Signal's own test suite, restored and run against this build of its source -- versions
    // from upstream's `gradle/test-libs.versions.toml`. The suite is the strongest check there
    // is that these modules were copied and compiled correctly, and it is the only thing that
    // exercises the receive-side refusals an ordinary conversation never trips.

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.willowtreeapps.assertk:assertk:0.28.1'
    testImplementation testFixtures(project(':signal-service:serialization'))
}
