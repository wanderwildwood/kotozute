// Signal-Android `core/util-jvm`, built from source.
// From `core/util-jvm/build.gradle.kts` at b92917acdb (2026-09-10).
//
// Versions are spelled out because this repo has no version catalogue; each one is the value
// `gradle/libs.versions.toml` gives upstream, except where a comment says otherwise.
plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.squareup.wire'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain(21)
}

wire {
    kotlin {
        javaInterop = true
    }

    sourcePath {
        srcDir('src/main/protowire')
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2'
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.29'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxkotlin:3.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation "org.signal:libsignal-client:$libsignal_version"

    // Signal's own test suite, restored and run against this build of its source -- versions
    // from upstream's `gradle/test-libs.versions.toml`. The suite is the strongest check there
    // is that these modules were copied and compiled correctly, and it is the only thing that
    // exercises the receive-side refusals an ordinary conversation never trips.

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.willowtreeapps.assertk:assertk:0.28.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}
