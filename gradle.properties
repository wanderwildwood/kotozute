# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3072m

# https://blog.gradle.org/introducing-gradle-build-cache
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Jetifier rewrites support-library references in
# every dependency, and it does it by holding the artifact in memory -- on libsignal's 194 MB
# AAR that is an out-of-memory error before anything is compiled. Nothing in libsignal
# references the support library; it is Signal's own code plus a TLS verifier. So it is
# skipped rather than the heap being raised to accommodate a transform that has no work to do.
android.jetifier.ignorelist=libsignal

# libsignal's classes use Java records, and desugaring one produces a "global synthetic" --
# a class D8 has to put somewhere shared rather than in the artifact being dexed. Without a
# consumer configured it refuses rather than guessing. This turns that pipeline on.
android.enableGlobalSyntheticGeneration=true

# AGP 9 brings its own Kotlin support and refuses kapt alongside it. Every annotation
# processor here runs through kapt -- Dagger, Glide, Realm -- and none of them has a KSP path
# on the versions this project pins, so the built-in support is declined rather than the
# processors rewritten. AGP documents this as the way to keep the old arrangement.
android.builtInKotlin=false
android.newDsl=false

# AGP 9's optimized resource shrinking needs non-final resource IDs. Taking the recommended
# path rather than switching the shrinker off: the risk of non-final IDs is Java `switch`
# statements over R.id, which require compile-time constants, and this project's Java is
# android-smsmms -- a library that does not touch app resources.
android.nonFinalResIds=true

# This project needs JDK 21. kapt generates javac stubs, and javac cannot read class files
# newer than its own JDK -- libsignal and the service layer ship Java 21, so a JDK 17 build
# fails with "class file has wrong version 65.0, should be 61.0". Signal-Android uses 21 too.
#
# `org.gradle.java.home` is deliberately NOT set here. It was an absolute path to a JDK on one
# particular machine, which works everywhere that machine is and nowhere else: it built for
# weeks locally and failed the moment a release ran on CI, where no such directory exists.
# CI asks for 21 in the workflow. A build machine whose default is older wants the property in
# its own ~/.gradle/gradle.properties, where machine-specific configuration belongs and where
# it is not published.
#
# CI asks for 21 in the workflow. A build machine whose default is something older wants
# `org.gradle.java.home` in its own ~/.gradle/gradle.properties, where machine-specific
# configuration belongs and where it is not published.
