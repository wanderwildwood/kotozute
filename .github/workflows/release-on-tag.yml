name: Release on tag

# Pushing a v* tag builds the release APK and attaches it to a GitHub Release.
# Pushing to master alone does NOT produce a release — tag explicitly, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-on-tag
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # JDK 17, NOT 21: this project's Kotlin/kapt toolchain dies on 21 with
      # "IllegalAccessError ... com.sun.tools.javac".
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The tag is the single source of truth for the version. versionCode is derived from
      # it rather than from the run number so it stays monotonic and reproducible: v1.2.3
      # becomes 10203. A workflow_dispatch run has a branch name here, not a version, so it
      # falls through to the defaults in presentation/build.gradle.
      # Without these the build falls back to the keystore committed at
      # presentation/einkmessaging.keystore, whose password is 'android' and whose private half
      # is public - the release would go out signed with a key anybody has. Fail loudly instead.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - refusing to build an unsigned release."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Build release APK
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version_name="${GITHUB_REF_NAME#v}"
            IFS=. read -r major minor patch <<< "$version_name"
            version_code=$(( major * 10000 + minor * 100 + patch ))
            echo "Building $version_name (versionCode $version_code)"
            ./gradlew :presentation:assembleRelease \
              -PappVersionName="$version_name" \
              -PappVersionCode="$version_code"
          else
            echo "Ref '$GITHUB_REF_NAME' is not a vX.Y.Z tag; using the versions in build.gradle"
            ./gradlew :presentation:assembleRelease
          fi

      # A release signed with the wrong key cannot be taken back once people have installed it.
      # The forbidden fingerprint is read from the repo's own keystore rather than hardcoded, so
      # regenerating that keystore cannot silently disarm the check. The committed key's DN now
      # says "throwaway key" outright, which the old one did not - it carried the same DN as the
      # real key, and only the fingerprint told them apart.
      - name: Verify the APK is not signed with the committed key
        run: |
          apk=$(find presentation/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          apk_digest=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          repo_digest=$(keytool -list -v -keystore presentation/einkmessaging.keystore -storepass android \
            | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          if [ -z "$apk_digest" ] || [ -z "$repo_digest" ]; then
            echo "::error::Could not read a signing certificate - refusing to release unchecked."
            exit 1
          fi
          if [ "$apk_digest" = "$repo_digest" ]; then
            echo "::error::APK is signed with the keystore committed to this repo."
            exit 1
          fi

      - name: Rename APK and generate checksum
        run: |
          apk_name="kotozute-${GITHUB_REF_NAME}.apk"
          apk_path=$(find presentation/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          cp "$apk_path" "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"

      # The generated notes are a list of commits; they cannot say what someone has to do
      # before installing. This goes above them, and can be emptied once nobody is still
      # upgrading from a build signed with the checked-in key.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kotozute-*.apk
            kotozute-*.apk.sha256
          body_path: .github/release-body.md
          generate_release_notes: true
