// Signal-Android `lib/network`, built from source.
// From `lib/network/build.gradle.kts` at b92917acdb (2026-09-10).
//
// This is the module the app talks to most directly -- `org.signal.network.api`,
// `org.signal.network.rest` and `org.signal.network.service` all live here, not in
// `core/network`. The directory is named `lib-network` rather than `network` only because
// `core/network` already holds that name here; upstream keeps them apart by path.
plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain(21)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        freeCompilerArgs.set(['-Xjvm-default=all'])
        suppressWarnings.set(true)
    }
}

dependencies {
    api project(':signal-service:libsignal-service')
    api project(':signal-service:network')
    implementation project(':signal-service:util-jvm')
    implementation project(':signal-service:models-jvm')
    implementation project(':signal-service:serialization')

    implementation "org.signal:libsignal-client:$libsignal_version"
    api 'com.squareup.okio:okio:3.17.0'
    implementation 'com.squareup.okhttp3:okhttp-coroutines:5.3.2'

    api 'io.reactivex.rxjava3:rxjava:3.1.12'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'

    // Signal's own test suite, restored and run against this build of its source -- versions
    // from upstream's `gradle/test-libs.versions.toml`. The suite is the strongest check there
    // is that these modules were copied and compiled correctly, and it is the only thing that
    // exercises the receive-side refusals an ordinary conversation never trips.

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.willowtreeapps.assertk:assertk:0.28.1'
    testImplementation 'io.mockk:mockk:1.13.17'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}
